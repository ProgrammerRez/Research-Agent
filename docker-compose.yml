version: '3.8'

services:
  cache:
    image: redis:7.2-alpine
    container_name: research_redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_state_volume:/data
    networks:
      - agent_mesh_network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: research_api_gateway
    restart: always
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://cache:6379
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./tests:/workspace/tests # Mounts tests directory into the container workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - agent_mesh_network

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: research_streamlit_ui
    restart: always
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://api:8000
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - agent_mesh_network

volumes:
  redis_state_volume:
    driver: local

networks:
  agent_mesh_network:
    driver: bridge